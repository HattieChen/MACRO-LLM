[MODEL_CONFIG]
rmsp_alpha = 0.99
rmsp_epsilon = 1e-5
max_grad_norm = 40
gamma = 0.99
lr_init = 5e-4
lr_decay = constant
entropy_coef = 0.05
value_coef = 0.5
num_lstm = 64
num_fc = 64
batch_size = 60
; same nodes may be updated by ~8 propagations,
; adjust norm accordingly
reward_norm = 5000.0
reward_clip = -1

[TRAIN_CONFIG]
total_step = 1e6
test_interval = 1e7
log_interval = 1e4

[ENV_CONFIG]
control_interval_sec = 0.5
episode_length_sec = 300
; control_interval_sec = 0.1
; episode_length_sec = 60
agent = ma2c_nc
batch_size = 60
coop_gamma = -1
; constraints
headway_min = 1
headway_st = 5
headway_go = 35
speed_max = 30
accel_max = 2.5
accel_min = -2.5
; reward
reward_v = 1
reward_u = 0.1
collision_penalty = 300
headway_target = 20
speed_target = 15
norm_headway = 10
norm_speed = 7.5
n_vehicle = 8
scenario = cacc_slowdown
seed = 12
test_seeds = 10000

[LLM_CONFIG]
; MODEL = gpt-4o-mini
; MODEL = gpt-4o
; MODEL_FLAG = GPT
; MODEL = meta-llama/llama-3.3-70b-instruct
; MODEL_FLAG = Llama
MODEL = mistralai/mistral-small-3.2-24b-instruct
MODEL_FLAG = Llama

; MODEL = qwen3-max
; MODEL = qwen-plus
; MODEL = qwen3-32b
; MODEL = qwen-flash
; MODEL = qwen-omni-turbo
; MODEL = deepseek-v3.1
; MODEL_FLAG = Ali

TEMP = 0.3
; TOP_P = 0.9
INSTRUCTION = LLMmodules/Prompts/Instruction/0_AgentInstructions.txt
MAX_MESSAGE = 100
REMAIN_MESSAGE = 10

; TEST_MODE = Rebuttal-4o-SD-5
; TEST_MODE = Rebuttal-Llama-SD-1
TEST_MODE = Rebuttal-Mistral-SD-1
; www-Chat-SD-10
SIMU_STEP_FLAG = 2
# 2 for MACRO, 1 for others
# 2: simulate two-step acceleration, 1: only one-step acceleration considered # 0: simulate two-step acceleration without increasing reward requirement.
SELF_DEFINE_FLAG = 0
# 1: Self-defined acceleration, 0: calculated weights-based acceleration
TARGET_FLAG = 1
# 0: TARGET, 1: AHEAD
KEEP_TEST_FLAG = 0
# 1: original calculated acceleration 0: acceleration after negotiation
CASE_FLAG = 2
# NOTE 1003: self-defined 2 --> 1 for ToM
; 0: self-defined linear weights, 1: absolute acceleration weights, 2: calculated optimal acceleration
W_FLAG = 2
;* 0: normalized gap, 1: absolute acceleration, 2: sigmoid
VELOCITY_FLAG = 1
;0: target velocity, 1: ahead velocity
TARGET_DIS = 20
